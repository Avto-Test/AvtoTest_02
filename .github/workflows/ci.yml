name: CI

on:
  push:
    branches: [main, clean]
  pull_request:
    branches: [main, clean]
  workflow_dispatch:

# Bir branch uchun bir vaqtda faqat bitta run — eskisi bekor qilinadi
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Migration smoke test: alembic upgrade head toza DB'da ─────────
  migrations:
    name: Alembic migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autotest_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: testing
      SECRET_KEY: ci-test-secret-key-not-for-production
      ALLOW_PROD_MIGRATIONS: "1"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/autotest_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply all migrations
        run: alembic upgrade head
      - name: Verify single head (bir nechta head bo'lmasin)
        run: |
          heads=$(alembic heads | grep -c "(head)")
          echo "head soni: $heads"
          test "$heads" -eq 1

  # ── Frontend: ESLint + Next build ─────────────────────────────────
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE: /api
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-dummy-client-id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  # ── Docker: image'lar build bo'lishini tekshirish (push qilinmaydi) ─
  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy: serverga SSH orqali (faqat main'ga push'da, CI o'tgach) ─
  deploy:
    name: Deploy (self-hosted)
    # Server NAT orqasida — bulutli runner ulanolmaydi. Serverning o'zidagi
    # self-hosted runner ishlatiladi (outbound ulanish, SSH kerak emas).
    runs-on: [self-hosted, linux]
    needs: [migrations, frontend, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # GitHub'da "production" environment yarating — manual approval/protection uchun.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # actions/checkout SHART EMAS — deploy /var/www/AvtoTest_02 ustida ishlaydi,
      # runner'ning ish katalogida emas.
      - name: Deploy
        run: |
          set -e
          cd /var/www/AvtoTest_02
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          bash deploy/deploy.sh
